name: App / Build release APK

on:
  push:
    branches:
      - release-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set version from branch name
        # release-0.20.0 -> 0.20.0; other branches get a development version.
        run: |
          version="${GITHUB_REF_NAME#release-}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then version="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "JELLYFIN_VERSION=$version" >> "$GITHUB_ENV"
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The KEYSTORE secret is not set"; exit 1; fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/keystore.jks"
      - name: Collect APK
        run: |
          mkdir -p build/gh-app-publish/
          mv app/build/outputs/apk/release/jellyfin-androidtv-*-release.apk build/gh-app-publish/
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          retention-days: 14
          if-no-files-found: error
          path: build/gh-app-publish/
